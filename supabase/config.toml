# CLI/local defaults only. No remote project linkage, credentials or business seed.
# The platform migration depends on the separately maintained ERP public schema.
project_id = "luyin-intelligence"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://localhost:3100"]
enable_signup = false
